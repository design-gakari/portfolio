<div class="gallery-controls">
  <button class="gallery-arrow gallery-prev" type="button" aria-label="前の画像">‹</button>
  <div class="gallery-dots">
    {{dots}}
  </div>
  <button class="gallery-arrow gallery-next" type="button" aria-label="次の画像">›</button>
</div>
<p class="gallery-status visually-hidden" aria-live="polite">{{count}}枚中1枚目</p>
