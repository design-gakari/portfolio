<section class="portfolio-hero wave-section">
  <div class="wrap">
    <p class="eyebrow">WORKS</p>
    <h1>作ったもの</h1>
    <p class="intro-copy">これまでに作ったものを、<br>一部ご紹介します。</p>
    <div class="portfolio-art" aria-hidden="true">
      <p class="aside-note">いろんな<br>「伝える」を<br>作ってきました。</p>
      <img class="person" src="assets/pcandme.png" alt="">
      <img class="books" src="assets/books.png" alt="">
      <img class="vase" src="assets/vase.png" alt="">
      <img class="coffee" src="assets/coffee.png" alt="">
    </div>
    <img class="leaf leaf-one" src="assets/leaf.png" alt="">
    <img class="leaf leaf-two" src="assets/leaf.png" alt="">
    <img class="leaf leaf-three" src="assets/leaf.png" alt="">
  </div>
</section>
<section class="portfolio-list wrap" aria-label="制作実績一覧">
  <div class="category-filters" role="group" aria-label="カテゴリーで絞り込む">
    {{filters}}
  </div>
  <p id="filter-status" class="visually-hidden" role="status"></p>
  <div class="works-grid">
    {{cards}}
  </div>
  <p class="filter-empty" hidden>このカテゴリーの制作物はありません。</p>
</section>
