<nav aria-label="パンくず">
  <ol class="breadcrumbs wrap">
    <li><a href="index.html">TOP</a></li>
    <li><a href="works.html">作ったもの</a></li>
    <li aria-current="page">{{title}}</li>
  </ol>
</nav>
<article class="detail-surface wave-section">
  <div class="wrap">
    <div class="work-gallery" role="region" aria-label="制作物画像">
      {{gallery}}
    </div>
    <div class="detail-copy">
      <span class="tag">{{category}}</span>
      <h1>{{title}}</h1>
      <!-- 制作物の詳細：画像・ファイル名からの推定原稿。ここから編集できます。 -->
      <dl class="work-metadata">
        {{metadata}}
      </dl>
      <!-- 説明文 -->
      {{description}}
      <a class="pill" href="works.html">作ったもの一覧に戻る <span aria-hidden="true">→</span></a>
      <img class="leaf" src="assets/leaf.png" alt="">
    </div>
  </div>
</article>
