<a class="work-card" href="{{href}}">
  <span class="work-photo-frame"><img class="work-photo" src="assets/{{image}}" alt="{{title}}" width="{{width}}" height="{{height}}" loading="lazy"></span>
  <div class="work-body">
    <span class="tag">{{tag}}</span>
    <h3>{{title}}</h3>
    <p>{{description}}</p>
    <span class="card-link" aria-hidden="true">→</span>
  </div>
</a>
